# The coding agents demo: the Agents page's hero, and its sneak peek on the homepage.
# The window's contents are drawn in layouts/partials/demo/agents.html; assets/js/landing.js plays it.
title: "demo | agents"  # the title of the pane it plays in
label: "The Zellij terminal with three coding agents working side by side. The api agent asks for permission to run the tests. The inbox opens on top, shows which pane needs attention, and the request is approved from there. The tests pass and the docs agent finishes."

# Scenes, played in a loop. Elements with data-states="1 2" show only in those scenes.
#   key:   the keys shown while it plays
#   focus: the pane with the focused frame (its data-pane)
#   set:   classes the scene adds, by selector
states:
  - { key: "", focus: a }
  - { key: "", focus: a, set: { ".tp-a": need } }
  - { key: "Ctrl g  o  i", focus: fl, set: { ".tp-a": need, ".tseg-float": "on" } }
  - { key: "Alt Enter  1", focus: fl, set: { ".tseg-float": "on" } }
  - { key: "Esc", focus: a }
reduced: 2  # shown, still, to people who prefer reduced motion
