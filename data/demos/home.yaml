title: "demo"
label: "A short tour of Zellij in four parts: panes, tabs and floating panes; sessions that keep running after their window closes, reopened from the tray icon and switched between with the session manager; desktop notifications and the inbox, which follows coding agents and long commands across sessions; and Zellij on a remote server over SSH, browsing its sessions with live previews and attaching to one inside the local session."
scene: 3600
caption: 2600
still: 0

chapters:
