baseURL = "https://zellij.dev/"
title   = "Zellij"
locale = "en-us"
capitalizeListTitles = false  # keep tag page titles as written; newer Hugo capitalizes them by default

rssLimit  = 10  # Maximum number of items in the RSS feed.
copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License." # This message is only used by the RSS template.

# googleAnalytics = ""
# disqusShortname = ""

archetypeDir = "archetypes"
contentDir   = "content"
dataDir      = "data"
layoutDir    = "layouts"
publishDir   = "public"

buildDrafts  = false
buildFuture  = false
buildExpired = false
canonifyURLs = true

enableRobotsTXT = true
enableGitInfo   = false
enableEmoji     = true
enableMissingTranslationPlaceholders = false
disableRSS     = false
disableSitemap = false
disable404     = false
disableHugoGeneratorInject = false

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false

[permalinks]
  posts = "/news/:title/"

[author]
  name = "Jane Doe"

[blackfriday]
  hrefTargetBlank = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false  # colors come from the .chroma rules in assets/css/site.css
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[taxonomies]
  tag      = "tags"

[params]
  dateform = "Jan 2, 2006"

  # Metadata mostly used in document's head
  #
  description = "Zellij is a terminal workspace and multiplexer for everything you run in a terminal. Every shortcut is on screen, and nothing stops when you close the window."
  keywords = "rust,terminal,multiplexer"
  images = ["/img/floating-panes-preview.png"]

  # Homepage (layouts/index.html). Update these with each release.
  #
  [params.landing]
    version         = "0.46.0"
    releasePost     = "/news/terminal-inbox-session-previews/"
    releaseHeadline = "Zellij now comes with its own terminal"
    title           = "Zellij: a terminal workspace and multiplexer"
    # GitHub stars, shown in the header, as of 2026-11-14 (from the GitHub API)
    stars           = "36.1k"

  # Social links, in the footer and on the News page

#   [[params.social]]
#     name = "email"
#     url  = "mailto:aram@poor.dev"

  [[params.social]]
    name = "github"
    url  = "https://github.com/zellij-org/zellij"

 [[params.social]]
   name = "bluesky"
   url  = "https://bsky.app/profile/zellij-dev.bsky.social"

 [[params.social]]
   name = "mastodon"
   url  = "https://hachyderm.io/@zellij"
