{{- /* /tags/: every tag, with how many posts use it. */ -}}
{{ define "main" }}
<div class="wrap session page-session">
  <div class="pane is-focus">
    <span class="pane-title" aria-hidden="true">{{ with .Data.Terms }}{{ len . }} {{ end }}tags</span>
    <header class="page-head">
      <h1>{{ .Title }}</h1>
    </header>
    <div class="page-body">
      <ul class="tags tags-big">
        {{- range .Data.Terms.ByCount }}
        <li><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}<small>{{ .Count }}</small></a></li>
        {{- end }}
      </ul>
    </div>
  </div>
</div>
{{ end }}
