{{- /* The other tutorials, newest first, in a pane like the homepage's docs section. */ -}}
<section class="pane related">
  <h3 class="pane-title">related tutorials</h3>
  <ul class="pane-links">
    {{- range (where .Site.RegularPages "Section" "tutorials").ByDate.Reverse }}
    {{- if ne . $.Page }}
    <li><a href="{{ .RelPermalink }}"><b>{{ .Title }}</b></a></li>
    {{- end }}
    {{- end }}
  </ul>
</section>
