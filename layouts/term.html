{{- /* /tags/<tag>/: the posts with that tag, newest first. */ -}}
{{ define "main" }}
<div class="wrap session page-session">
  <div class="pane is-focus">
    <span class="pane-title" aria-hidden="true">{{ len .Pages }} posts</span>
    <header class="page-head">
      <h1><span class="hash" aria-hidden="true">#</span>{{ .Title }}</h1>
    </header>
    <div class="page-body">
      <ul class="rows">
        {{- range .Pages.ByDate.Reverse }}
        <li>{{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format .Site.Params.dateform }}</time>{{ end }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{- end }}
      </ul>
    </div>
  </div>
</div>
{{ end }}
