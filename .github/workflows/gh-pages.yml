name: Push to GitHub Pages on push to master
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'content/**'
      - 'svg/**'
      - 'layouts/**'
      - 'static/**'
      - 'themes/**'
      - 'config.toml'
jobs:
  build:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'

      - name: Build mdBook
        run: mdbook build docs/ -d ../static/documentation

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.0'

      # Hugo calls Dart Sass to compile the theme's SCSS (layouts/partials/head.html)
      - name: Setup Dart Sass
        env:
          DART_SASS_VERSION: '1.108.2'
        run: |
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: zellij.dev
